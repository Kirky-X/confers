# CodeQL 静态安全分析（GitHub 原生，跨语言自动检测）。
# 触发: push 到主分支 / PR / 每周二定时全量扫描
# 无需额外 secret：使用自动注入的 GITHUB_TOKEN。
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "37 4 * * 2" # 每周二 04:37 UTC（避开整点）

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:rust"
