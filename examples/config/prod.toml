# 生产环境覆盖（中等优先级）：只写与 base.toml 不同的项，
# 其余项（如 version）沿用 base.toml。

[app]
environment = "production"

[server]
host = "0.0.0.0"
port = 8080
workers = 8

[database]
url = "postgres://db-primary:5432/confers_demo"
max_connections = 100
connection_timeout = 5

[logging]
level = "warn"
format = "json"

[cache]
enable = true
ttl = 3600

[security]
https = true
cors = false
allowed_origins = ["https://example.com"]

[production]
health_check = true
rate_limit = true
max_request_size = 10485760
monitoring = true
