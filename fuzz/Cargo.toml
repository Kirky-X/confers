[package]
name = "confers-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
confers = { version = "0.6.0-rc.7", path = "..", default-features = false, features = ["full"] }
libfuzzer-sys = { version = "0.4", default-features = false, features = ["link_libfuzzer"] }

[[bin]]
name = "merger"
path = "fuzz_targets/merger.rs"

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"
doc = false

# 独立于主 workspace（根 Cargo.toml exclude = ["fuzz"]）；自带空 workspace 按
# cargo-fuzz 惯例脱离继承，避免引用不存在的 workspace.package 字段
[workspace]
