[package]
name = "confers-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
confers = { version = "0.6.0-rc.4", path = "..", features = ["full"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "merger"
path = "fuzz_targets/merger.rs"

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"
doc = false
