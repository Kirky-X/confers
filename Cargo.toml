[package]
name = "confers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
autobenches = false
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[lints]
workspace = true

[dependencies]
arc-swap = { version = "1.9", default-features = false, optional = true }
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "server_2_10", "server_2_11", "server_2_12", "server_2_14"], optional = true }
async-stream = { version = "0.3", default-features = false, optional = true }
async-trait = { version = "0.1", default-features = false, optional = true }
base64 = { version = "0.23", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"], optional = true }
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive", "env"], optional = true }
confers-macros = { version = "0.6.0-rc.6", path = "macros" }
dashmap = { version = "6.2", default-features = false, optional = true }
garde = { version = "0.23", default-features = false, features = ["derive", "email", "url", "regex"], optional = true }
fluent-bundle = { version = "0.16", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"], optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
indexmap = { version = "2.14", default-features = false, features = ["std", "serde"] }
notify-debouncer-full = { version = "0.7", default-features = false, features = ["macos_fsevent"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
schemars = { version = "1.2", default-features = false, features = ["derive", "std"], optional = true }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_path_to_error = { version = "0.1", default-features = false }
serde_yaml_ng = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
sys-locale = { version = "0.3", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
dotenvy = { version = "0.15", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"], optional = true }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time", "fs"], optional = true }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display", "preserve_order"], optional = true }
zeroize = { version = "1.9", default-features = false, features = ["alloc", "derive"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"], optional = true }
unic-langid = { version = "0.9", default-features = false }
etcd-client = { version = "0.20", default-features = false, features = ["tls"], optional = true }
ipnet = { version = "2.12", default-features = false, features = ["std"], optional = true }
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp"], optional = true }
url = { version = "2.5", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["std"], optional = true }
rand = { version = "0.10", default-features = false, features = ["thread_rng"], optional = true }
similar = { version = "3.2", default-features = false, features = ["std", "text"], optional = true }
moka = { version = "0.12", default-features = false, features = ["future", "sync"] }
itoa = { version = "1.0", default-features = false }
log = { workspace = true, optional = true }

[workspace]
members = ["macros", "examples"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.6.0-rc.6"
edition = "2024"
rust-version = "1.97.1"
description = "Production-ready Rust configuration library with zero boilerplate"
license = "MIT"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/confers"
homepage = "https://github.com/Kirky-X/confers"
documentation = "https://docs.rs/confers"
keywords = ["config", "configuration", "settings", "env"]
categories = ["config", "development-tools"]

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive", "env"] }
darling = { version = "0.24", default-features = false, features = ["suggestions"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
garde = { version = "0.23", default-features = false, features = ["derive", "email", "url", "regex"] }

indexmap = { version = "2.14", default-features = false, features = ["std", "serde"] }
log = { version = "0.4", default-features = false }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml_ng = { version = "0.10", default-features = false }
similar = { version = "3.2", default-features = false, features = ["std", "text"] }
syn = { version = "3.0", default-features = false, features = ["derive", "parsing", "printing", "clone-impls", "proc-macro", "full", "extra-traits"] }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", default-features = false }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display", "preserve_order"] }
trybuild = { version = "1.0", default-features = false }
serial_test = { version = "4.0", default-features = false } # >=3.5 drops the `scc` dependency (RUSTSEC-2026-0205)

[workspace.lints.rust]

[workspace.lints.clippy]

[lib]
bench = false

[features]
default = ["toml", "json", "dotenv"]

# Format support
toml = ["dep:toml"]
json = []
yaml = ["dep:serde_yaml_ng"]
ini = []
# dotenv 正名（该特性实际语义是 .env 文件加载，env 曾与 SourceKind::Environment
# 术语冲突）；env 降级为兼容别名，下一版本移除。
dotenv = ["dep:dotenvy"]
env = ["dotenv"]

# Core features
# Internal aggregate predicate: true whenever any async background capability
# (remote / config-bus / encryption / watch) is enabled. Implementation cfg's
# gate on this instead of repeating the four-feature disjunction.
async-core = []
validation = ["dep:garde"]
typescript-schema = ["json-schema"]
# security 与 encryption 解耦（FEATURE_AUDIT_REPORT §9.2-5）：本模块仅需
# zeroize（SecureString 零化）与 sha2+hex（fingerprint 指纹）三个轻量原语，
# 不再经 encryption 整链拉入加密栈（chacha20poly1305/hkdf/tokio 等）；
# security-rules 为纯计算校验，经本条同享解耦。
security = ["dep:zeroize", "dep:sha2", "dep:hex"]
security-rules = ["security", "dep:ipnet"]
# key-management 正名（密钥轮换/版本管理语义；key 过泛，为兼容别名，下一版移除）。
key-management = ["encryption", "dep:chrono", "dep:rand", "dep:hex"]
key = ["key-management"]
watch = ["dep:notify-debouncer-full", "dep:tokio", "dep:arc-swap", "dep:async-trait", "dep:log", "async-core"]
encryption = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:zeroize", "dep:async-trait", "dep:tokio", "dep:getrandom", "async-core"]
cli = ["dep:clap", "dep:similar", "toml", "json", "yaml", "dep:chrono", "json-schema"]
# json-schema 正名（产出即 JSON Schema；schema 为兼容别名，下一版移除）。
json-schema = ["dep:schemars"]
schema = ["json-schema"]
dynamic = ["dep:arc-swap", "dep:tokio", "dep:dashmap"]
feature-toggle = ["dep:dashmap"]
progressive-reload = ["watch", "dep:arc-swap", "dep:async-trait"]
hot-reload-kit = ["watch", "progressive-reload"]
audit = ["dep:chrono", "dep:sha2", "dep:hmac", "dep:hex", "dep:getrandom"]
migration = ["dep:chrono"]
snapshot = ["dep:chrono", "dep:tokio", "json", "toml", "yaml", "dynamic"]
interpolation = []
tracing = ["dep:tracing"]

# Remote sources
remote = ["dep:reqwest", "dep:async-trait", "dep:tokio", "dep:ipnet", "dep:arc-swap", "async-core"]

# Remote SDK integrations
etcd = ["remote", "dep:etcd-client", "dep:tokio", "dep:async-trait", "dep:reqwest", "dep:arc-swap", "toml", "json", "yaml"]
etcd-watch = ["etcd", "dep:futures-util"]
k8s = ["remote", "toml", "json", "yaml"]
cloud-kms = ["encryption", "remote", "dep:hmac", "dep:hex"]
keyring = ["encryption", "dep:log"]
openfeature = ["feature-toggle", "context-aware"]
# 惰性分段解析超大文档（lazy_parse 模块；语义见 src/lazy.rs——按 SOURCE_NAME 分段懒加载）
lazy-parse = ["toml"]
nacos = ["remote", "toml", "json", "yaml"]
consul = ["remote", "dep:tokio", "dep:async-trait", "dep:reqwest", "dep:arc-swap", "toml", "json", "yaml"]

# Message bus
config-bus = ["dep:tokio", "dep:async-trait", "dep:futures-util", "dep:chrono", "dep:tokio-stream", "dep:log", "async-core"]
nats-bus = ["config-bus", "dep:async-nats"]
redis-bus = ["config-bus", "dep:redis", "dep:async-stream"]

# Unified change stream port (reuses the config-bus transport)
change-stream = ["config-bus", "watch"]

# Canary rollout orchestrator：消费 ChangeStream 的多实例金丝雀编排
# （复用 progressive-reload 的 HealthStatus 语义）
canary = ["change-stream", "progressive-reload"]

# Context-aware：上下文感知配置（src/context——按调用方上下文解析/取值）
context-aware = []

# Modules：模块注册表——按 feature 装配配置模块（ModuleConfig/ModuleRegistry，src/modules.rs）
modules = ["toml"]

# Feature presets
recommended = ["toml", "dotenv", "validation", "json", "security-rules"]
dev = ["toml", "json", "yaml", "dotenv", "cli", "validation", "json-schema", "audit", "watch", "migration", "snapshot", "dynamic"]
production = ["toml", "dotenv", "watch", "encryption", "validation", "audit", "json-schema", "cli", "migration", "dynamic", "progressive-reload", "snapshot", "security-rules", "feature-toggle"]
full = ["toml", "json", "yaml", "ini", "dotenv", "cli", "validation", "watch", "encryption", "security", "security-rules", "key-management", "json-schema", "typescript-schema", "dynamic", "progressive-reload", "audit", "migration", "snapshot", "interpolation", "remote", "config-bus", "nats-bus", "redis-bus", "change-stream", "context-aware", "modules", "etcd", "consul", "feature-toggle", "etcd-watch", "k8s", "nacos", "cloud-kms", "keyring", "openfeature", "lazy-parse", "tracing", "canary"]
minimal = ["dotenv", "json"]
distributed = ["toml", "json", "dotenv", "watch", "validation", "config-bus", "progressive-reload", "audit"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = { workspace = true }
async-nats = { workspace = true }  # for test_nats_bus_options

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "merge_bench"
harness = false
required-features = ["interpolation"]

[[bench]]
name = "load_bench"
harness = false

[[bench]]
name = "dynamic_field_bench"
harness = false
required-features = ["dynamic"]

[[bench]]
name = "hot_path_bench"
harness = false
required-features = ["dynamic", "watch"]

[[bench]]
name = "concurrent_rw_bench"
harness = false
required-features = ["dynamic", "watch"]

[[bench]]
name = "concurrent_access_bench"
harness = false
required-features = ["dynamic"]

[[bench]]
name = "interpolation_bench"
harness = false
required-features = ["interpolation"]

[[bench]]
name = "watch_callback_bench"
harness = false
required-features = ["change-stream"]

[[bench]]
name = "etcd_watch_bench"
