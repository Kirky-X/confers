[package]
name = "confers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
autobenches = false
autotests = false

[lints]
workspace = true

[dependencies]
arc-swap = { version = "1.9", optional = true }
async-nats = { version = "0.50", optional = true }
async-stream = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"], optional = true }
compact_str = { version = "0.10", features = ["serde"] }
confers-macros = { version = "0.6.0-rc.2", path = "macros" }
dashmap = { version = "6.1", optional = true }
garde = { version = "0.23", optional = true, features = ["derive", "email", "url", "regex"] }
futures-util = { version = "0.3", optional = true }
hkdf = { version = "0.13", optional = true }
indexmap = { version = "2.13", features = ["serde"] }
notify-debouncer-full = { version = "0.7", optional = true }
reqwest = { version = "0.13", features = ["json", "rustls"], optional = true }
schemars = { version = "1.2", optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.4", optional = true }
thiserror = "2.0"
dotenvy = { version = "0.15", optional = true }
aes-gcm = { version = "0.11", optional = true }
serde_ini = { version = "0.2", optional = true }
regex = "1.11"
anyhow = "1.0"
tokio = { version = "1.50", features = ["rt", "sync", "time", "fs"], optional = true }
toml = { version = "1.1", features = ["preserve_order"], optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
etcd-client = { version = "0.20", features = ["tls"], optional = true }
ipnet = { version = "2.11", optional = true }
redis = { version = "1.1", features = ["tokio-comp"], optional = true }
url = "2.5"
hex = { version = "0.4", optional = true }
rand = { version = "0.10", optional = true }
similar = { version = "3.1", optional = true }
moka = { version = "0.12", features = ["future", "sync"] }
getset = "0.1"
itoa = "1.0"

[workspace]
members = ["macros", "examples"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.6.0-rc.2"
edition = "2024"
rust-version = "1.97.1"
description = "Production-ready Rust configuration library with zero boilerplate"
license-file = "LICENSE"
authors = ["Kirky <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/confers"
homepage = "https://github.com/Kirky-X/confers"
documentation = "https://docs.rs/confers"
keywords = ["config", "configuration", "settings", "env"]
categories = ["config", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
compact_str = { version = "0.10", features = ["serde"] }
darling = "0.24"
futures = "0.3"
indexmap = { version = "2.13", features = ["serde"] }
proc-macro2 = "1.0"
proptest = "1.11"
quote = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_spanned = "1.1"
serde_yaml_ng = "0.10"
similar = "3.1"
syn = { version = "3.0", features = ["full", "parsing", "extra-traits"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.50", features = ["rt", "sync", "time", "fs"] }
tokio-stream = "0.1"
toml = { version = "1.1", features = ["preserve_order"] }
trybuild = "1.0"
serial_test = "3.5" # >=3.5 drops the `scc` dependency (RUSTSEC-2026-0205)

[workspace.lints.rust]

[workspace.lints.clippy]

[lib]
bench = false

[features]
default = ["toml", "json", "env"]

# Format support
toml = ["dep:toml"]
json = []
yaml = ["dep:serde_yaml_ng"]
ini = ["dep:serde_ini"]
env = ["dep:dotenvy"]
dotenv = ["env"]

# Core features
validation = ["dep:garde"]
typescript-schema = ["schema"]
security = ["encryption", "dep:hex"]
security-rules = ["security", "dep:ipnet"]
key = ["encryption", "dep:chrono", "dep:rand", "dep:hex"]
watch = ["dep:notify-debouncer-full", "dep:tokio", "dep:arc-swap", "dep:async-trait"]
encryption = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:secrecy", "dep:zeroize", "dep:async-trait", "dep:tokio", "dep:aes-gcm", "dep:getrandom"]
cli = ["dep:clap", "dep:similar", "toml", "json", "yaml", "dep:chrono"]
schema = ["dep:schemars"]
dynamic = ["dep:arc-swap", "dep:tokio", "dep:dashmap"]
feature-toggle = ["dep:dashmap"]
progressive-reload = ["watch", "dep:arc-swap", "dep:async-trait"]
audit = ["dep:chrono"]
migration = ["dep:chrono"]
snapshot = ["dep:chrono", "dep:tokio", "json", "toml", "yaml", "dynamic"]
interpolation = []

# Remote sources
remote = ["dep:reqwest", "dep:async-trait", "dep:tokio", "dep:ipnet", "dep:arc-swap"]

# Remote SDK integrations
etcd = ["remote", "dep:etcd-client", "dep:tokio", "dep:async-trait", "dep:reqwest", "dep:arc-swap", "toml", "json", "yaml"]
consul = ["remote", "dep:tokio", "dep:async-trait", "dep:reqwest", "dep:arc-swap", "toml", "json", "yaml"]

# Message bus
config-bus = ["dep:tokio", "dep:async-trait", "dep:futures-util", "dep:chrono", "dep:tokio-stream"]
nats-bus = ["config-bus", "dep:async-nats"]
redis-bus = ["config-bus", "dep:redis", "dep:async-stream"]

# Context-aware
context-aware = []

# Modules
modules = ["toml"]

# Feature presets
recommended = ["toml", "env", "validation", "json", "security-rules"]
dev = ["toml", "json", "yaml", "env", "cli", "validation", "schema", "audit", "watch", "migration", "snapshot", "dynamic"]
production = ["toml", "env", "watch", "encryption", "validation", "audit", "schema", "cli", "migration", "dynamic", "progressive-reload", "snapshot", "security-rules", "feature-toggle"]
full = ["toml", "json", "yaml", "ini", "env", "dotenv", "cli", "validation", "watch", "encryption", "security", "security-rules", "key", "schema", "typescript-schema", "dynamic", "progressive-reload", "audit", "migration", "snapshot", "interpolation", "remote", "config-bus", "nats-bus", "redis-bus", "context-aware", "modules", "etcd", "consul", "feature-toggle"]
minimal = ["env", "json"]
distributed = ["toml", "json", "env", "watch", "validation", "config-bus", "progressive-reload", "audit"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = { workspace = true }
async-nats = "0.50"  # for test_nats_bus_options

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "merge_bench"
harness = false
required-features = ["interpolation"]

[[bench]]
name = "load_bench"
harness = false

[[bench]]
name = "dynamic_field_bench"
harness = false
required-features = ["dynamic"]

[[bench]]
name = "hot_path_bench"
harness = false
required-features = ["dynamic", "watch"]

[[bench]]
name = "concurrent_rw_bench"
harness = false
required-features = ["dynamic", "watch"]

[[bench]]
name = "concurrent_access_bench"
harness = false
required-features = ["dynamic"]

[[bench]]
name = "interpolation_bench"
harness = false
required-features = ["interpolation"]

[[bench]]
name = "value_path_bench"
harness = false
required-features = ["interpolation"]

[[test]]
name = "core"
path = "tests/core/mod.rs"

[[test]]
name = "security"
path = "tests/security/mod.rs"

[[test]]
name = "remote"
path = "tests/remote/mod.rs"

[[test]]
name = "watcher"
path = "tests/watcher/mod.rs"

[[test]]
name = "cli"
path = "tests/cli/mod.rs"
required-features = ["cli"]

[[test]]
name = "format_e2e"
path = "tests/e2e/format_e2e.rs"
required-features = ["toml", "json", "ini"]

[[test]]
name = "builder_e2e"
path = "tests/e2e/builder_e2e.rs"
required-features = ["toml", "json"]

[[test]]
name = "validation_e2e"
path = "tests/e2e/validation_e2e.rs"
required-features = ["validation", "toml"]

[[test]]
name = "interpolation_e2e"
path = "tests/e2e/interpolation_e2e.rs"
required-features = ["interpolation"]

[[test]]
name = "audit_e2e"
path = "tests/e2e/audit_e2e.rs"
required-features = ["audit"]

[[test]]
name = "combo_e2e"
path = "tests/e2e/combo_e2e.rs"
required-features = ["full"]

[[test]]
name = "bus_e2e"
path = "tests/e2e/bus_e2e.rs"
required-features = ["nats-bus", "redis-bus"]

[[test]]
name = "remote_e2e"
path = "tests/e2e/remote_e2e.rs"
required-features = ["etcd", "consul"]

[[test]]
name = "dynamic_e2e"
path = "tests/e2e/dynamic_e2e.rs"
required-features = ["dynamic", "watch", "toml"]

[[test]]
name = "macro_e2e"
path = "tests/e2e/macro_e2e.rs"
required-features = ["watch"]

[[test]]
name = "encryption_e2e"
path = "tests/e2e/encryption_e2e.rs"
required-features = ["security"]

[[test]]
name = "snapshot_e2e"
path = "tests/e2e/snapshot_e2e.rs"
required-features = ["snapshot"]

[[test]]
name = "watch_e2e"
path = "tests/e2e/watch_e2e.rs"
required-features = ["watch", "dynamic", "toml"]

[[test]]
name = "cli_e2e"
path = "tests/e2e/cli_e2e.rs"
required-features = ["cli"]

[[test]]
name = "toggle_e2e"
path = "tests/e2e/toggle_e2e.rs"
required-features = ["feature-toggle"]

[[test]]
name = "modules_e2e"
path = "tests/e2e/modules_e2e.rs"
required-features = ["modules", "toml"]

[[test]]
name = "key_e2e"
path = "tests/e2e/key_e2e.rs"
required-features = ["key", "encryption"]

[[test]]
name = "security_rules_e2e"
path = "tests/e2e/security_rules_e2e.rs"
required-features = ["security", "security-rules"]

[[test]]
name = "progressive_e2e"
path = "tests/e2e/progressive_e2e.rs"
required-features = ["progressive-reload", "toml"]

[[test]]
name = "migration_e2e"
path = "tests/e2e/migration_e2e.rs"
required-features = ["migration", "toml"]

[[test]]
name = "context_e2e"
path = "tests/e2e/context_e2e.rs"
required-features = ["context-aware"]

[[test]]
name = "concurrency_e2e"
path = "tests/e2e/concurrency_e2e.rs"
required-features = ["watch", "snapshot", "config-bus", "feature-toggle", "progressive-reload", "toml"]

[[test]]
name = "presets_e2e"
path = "tests/e2e/presets_e2e.rs"
# 无 required-features:所有特性组合(含 --no-default-features)都会编译运行,即 PRS-01 门禁。

[[test]]
name = "schema_e2e"
path = "tests/e2e/schema_e2e.rs"
required-features = ["typescript-schema"]

[[bin]]
name = "confers"
path = "src/cli/main.rs"
required-features = ["cli"]
bench = false
