# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)
# RUSTSEC-2024-0449(unsafe-libyaml unmaintained)已随 yaml 后端迁移
# serde_yaml_ng → serde-saphyr(纯 Rust)退出依赖图,豁免条目回收。

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"
# 许可证口径（2026-10-12 用户裁决）：统一纯 MIT——manifest license = "MIT"，
# LICENSE 文件已删除 Commons Clause 段，deny 直接读 manifest SPDX，无需 clarify。


[bans]
multiple-versions = "warn"
wildcards = "warn"  # confers-macros dev-dep 故意 path-only（注释见 macros/Cargo.toml）

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
